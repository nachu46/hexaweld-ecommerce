<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="/logo.png">
    <title>Jaza Trading W.L.L — Building Materials, Power Tools & Safety Wholesaler | Qatar</title>

    <!-- Opening screen: shown instantly, removed by main.jsx once the app has rendered -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #fff;
        transition: opacity .6s ease, visibility .6s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .logo-wrap { position: relative; overflow: hidden; }
      #splash img {
        display: block; width: 220px; max-width: 60vw; height: auto;
        animation: splash-in .9s cubic-bezier(.22,1,.36,1) both, splash-breathe 2.4s ease-in-out .9s infinite;
      }
      /* light sweep across the logo */
      #splash .logo-wrap::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,.85), transparent);
        animation: splash-sweep 1.8s ease-in-out .6s infinite;
      }
      #splash .bar { width: 160px; height: 3px; border-radius: 3px; background: #ececec; overflow: hidden; }
      #splash .bar span {
        display: block; height: 100%; width: 40%; border-radius: 3px; background: #111;
        animation: splash-bar 1.2s ease-in-out infinite;
      }
      @keyframes splash-in { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
      @keyframes splash-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
      @keyframes splash-sweep { to { left: 120%; } }
      @keyframes splash-bar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .logo-wrap::after, #splash .bar span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="logo-wrap"><img src="/logo.png" alt="Jaza Trading"></div>
      <div class="bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
